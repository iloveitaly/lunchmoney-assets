[project]
name = "lunchmoney-assets"
version = "0.1.0"
description = "Automatically update LunchMoney asset balances by scraping real estate and vehicle valuations."
readme = "README.md"
keywords = ["lunchmoney", "firecrawl", "scraping", "assets"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.2.1",
    "firecrawl-py>=4.13.4",
    "httpx2>=2.12.0",
    "lunchable>=1.4.3",
    "pydantic>=2.12.5",
    "python-decouple-typed>=3.11.0",
    "structlog-config>=0.8.0",
    "whenever>=0.11.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/lunchmoney-assets" }

[project.scripts]
lunchmoney-assets = "lunchmoney_assets.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["lunchmoney_assets"]

[tool.coverage.report]
fail_under = 50
